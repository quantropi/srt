name: cxx11-macos

on:
  # push:
  #   branches: [ master ]
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:
    inputs:
      qispace_sdk_ver:
        description: qispace sdk version, eg R1.9.0
        type: string
        required: false
      ENCLIB:
        description: option of cypto library
        type: choice
        options: 
        - openssl-evp
        - qispace
        - mbedtls
jobs:
  build:
    name: macos
    runs-on: macos-latest
    env:
      QISPACE_SDK_VER: "${{ inputs.qispace_sdk_ver || 'R1.9.0' }}"

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.ORG_S3_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.ORG_S3_AWS_SECRET_ACCESS_KEY }}
        aws-region: ca-central-1

    - name: Download QiSpace SDK
      if: inputs.qispace_sdk_ver != ''
      run: |
        mkdir -p qispace_qeep
        aws s3 cp s3://qispace-sdk-release/${{ env.QISPACE_SDK_VER }}/qispace-QEEP-SDK-${{ env.QISPACE_SDK_VER }}-macos.zip qispace_qeep/qispace-QEEP-SDK-${{ env.QISPACE_SDK_VER }}-macos.zip
        unzip qispace_qeep/qispace-QEEP-SDK-${{ env.QISPACE_SDK_VER }}-macos.zip -d qispace_qeep
        mv qispace_qeep/qispace-QEEP-SDK-${{ env.QISPACE_SDK_VER }}-macos/* qispace_qeep/
        rmdir qispace_qeep/qispace-QEEP-SDK-${{ env.QISPACE_SDK_VER }}-macos

    - name: configure
      run: |
        brew install automake autoconf libtool
        mkdir _build && cd _build
        cmake ../ -DENABLE_STDCXX_SYNC=ON -DUSE_ENCLIB=${{ inputs.ENCLIB }} -DENABLE_TESTING=ON -DENABLE_EXAMPLES=ON -DUSE_CXX_STD=14 -DQISPACE_SDK_DIR="../qispace_qeep"

    - name: build
      run: cd _build && cmake --build ./
    - name: test
      run: cd _build && ctest --extra-verbose

    - name: Archive build results
      uses: actions/upload-artifact@v4
      with:
        name: qsrt-qeep-macos
        path: |
          _build
        retention-days: 365